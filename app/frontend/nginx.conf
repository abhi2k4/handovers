# Serves the built SPA and forwards /api to the backend container (same-origin, no CORS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's DNS, re-asked every 10 s, and the address in a variable: nginx resolves `backend` per
    # request instead of once at startup, so a restarted backend (new IP) does not leave 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Server-sent events (chat streaming) must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
