# Handovers stack. Run from the repository root (Compose reads ./.env automatically).
#
# First time (and after pulling a change to .env.example):
#   python setup.py
# Everything in Docker:
#   docker compose up -d --build
#
# Dev with live reload: keep FalkorDB in Docker, run backend + frontend on the host.
#   docker compose stop backend frontend
#   (then see app/backend/README.md and app/frontend/README.md)
#
# FalkorDB only (skip building the app images):
#   docker compose up -d falkordb

name: handovers

services:
  falkordb:
    image: falkordb/falkordb:6.0.1
    container_name: handovers-falkordb
    ports:
      - "${FALKORDB_PORT:-6379}:6379"   # Redis protocol (backend connects here)
      - "${FALKORDB_BROWSER_PORT:-3000}:3000"   # FalkorDB Browser UI
    environment:
      # Password-protected, append-only persistence (survives restarts).
      REDIS_ARGS: "--requirepass ${FALKORDB_PASSWORD:-handovers-dev} --appendonly yes --appendfsync everysec"
      # Replaces the image default (which caps reads at 1 s). Values in ms.
      FALKORDB_ARGS: "MAX_QUEUED_QUERIES 25 TIMEOUT_MAX 60000 TIMEOUT_DEFAULT 15000 RESULTSET_SIZE 10000"
      # Lets redis-cli inside the container authenticate (healthcheck, `docker compose exec`).
      REDISCLI_AUTH: "${FALKORDB_PASSWORD:-handovers-dev}"
    volumes:
      # The image stores data in FALKORDB_DATA_PATH=/var/lib/falkordb/data.
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Keycloak: sign-in (email, Google, Microsoft). Behind the "auth" profile, which setup.py turns on
  # in .env (COMPOSE_PROFILES=auth), so `docker compose up` includes it.
  # The browser must reach it (sign-in is a redirect), so KEYCLOAK_PUBLIC_URL is the address the
  # browser uses and the token issuer. The realm is imported on FIRST start only; later changes go
  # through the admin console or the app (sign-in providers). See deployment/README.md.
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: handovers-keycloak
    profiles: ["auth"]
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_HOSTNAME: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # The master-realm administrator: the Keycloak admin console only; cannot sign in to Handovers.
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KC_BOOTSTRAP_ADMIN_USERNAME:-keycloak-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_BOOTSTRAP_ADMIN_PASSWORD:-handovers-dev-admin}"
      # Substituted into the realm file on import. The defaults are for local development only;
      # set real values in .env anywhere else (deployment/README.md).
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET:-handovers-dev-client-secret}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-http://localhost:5173}"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./deployment/keycloak/handovers-realm.json:/opt/keycloak/data/import/handovers-realm.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8180"
    healthcheck:
      # No curl in the image; health is served on the management port, 9000.
      test:
        - "CMD-SHELL"
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000
          && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && grep -q UP <&3
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  # Mailpit: catches every alert email in a local web inbox (http://localhost:8025). Open source,
  # for development and demos; set SMTP_HOST in .env to send real mail instead.
  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: handovers-mailpit
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"   # the inbox
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"   # SMTP, for a backend running on the host
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    container_name: handovers-backend
    env_file:
      - path: .env
        required: false
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_PASSWORD: "${FALKORDB_PASSWORD:-handovers-dev}"
      # Load the synthetic company into an empty graph on first start.
      SEED_ON_START: "${SEED_ON_START:-true}"
      # Inside Docker the backend reaches Keycloak by service name; empty when sign-in is off.
      KEYCLOAK_URL: "${KEYCLOAK_URL:+http://keycloak:8180}"
      # Email alerts go to the bundled Mailpit unless .env names a real SMTP server.
      SMTP_HOST: "${SMTP_HOST:-mailpit}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      falkordb:
        condition: service_healthy
      # Only when the "auth" profile is on (COMPOSE_PROFILES in .env): wait for sign-in to be ready.
      keycloak:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
    container_name: handovers-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  falkordb_data:
  keycloak_data:
